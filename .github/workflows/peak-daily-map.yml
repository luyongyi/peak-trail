name: Update PEAK daily map

on:
  schedule:
    # PEAK rotates at 17:00 UTC. GitHub schedules can run a few minutes late.
    - cron: "10 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: vars.PEAK_DAILY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    concurrency:
      group: peak-daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve current PEAK map
        run: node PeakTrailPlatform/tools/update-daily.mjs
        env:
          PEAK_API_VERSION: "2.4"
          PEAK_MAP_COUNT: "21"
      - name: Validate viewer and data
        run: |
          npm --prefix PeakTrailPlatform/web run check
          npm --prefix PeakTrailPlatform/web test
          node --test PeakTrailPlatform/tools/tests/*.test.mjs
      - name: Commit changed daily data
        shell: bash
        run: |
          git add PeakTrailPlatform/data/daily
          if git diff --cached --quiet; then
            echo "Daily data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update PEAK daily map"
          git push
      - name: Record the tested daily commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not start another push workflow. Deploy explicitly
  # here as well, using the commit just tested and written by the update job.
  deploy-server:
    needs: update
    if: vars.PEAK_SERVER_ENABLED == 'true'
    uses: ./.github/workflows/peak-server-deploy.yml
    secrets: inherit
    with:
      revision: ${{ needs.update.outputs.revision }}

  deploy:
    needs: update
    if: vars.PEAK_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: peak-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require independently provisioned game assets
        run: |
          test -f local/assets/game-assets/catalog.json || {
            echo "Restore the approved local/assets backup before enabling PEAK_PAGES_ENABLED."
            exit 1
          }
      - name: Validate viewer and data
        run: |
          npm --prefix PeakTrailPlatform/web run check
          npm --prefix PeakTrailPlatform/web test
          node --test PeakTrailPlatform/tools/tests/*.test.mjs
          node PeakTrailPlatform/tools/validate-data.mjs
      - name: Stage static site
        run: node PeakTrailPlatform/tools/stage-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: PeakTrailPlatform/site-dist
          include-hidden-files: true
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

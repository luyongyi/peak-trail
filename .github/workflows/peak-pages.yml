name: Deploy PEAK Trail Pages

on:
  push:
    paths:
      - "PeakTrailPlatform/**"
      - ".github/workflows/peak-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: peak-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Game assets are intentionally not in Git. Provision an approved asset
    # restore step below before opting in with repository variables.
    if: vars.PEAK_PAGES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require independently provisioned game assets
        run: |
          test -f local/assets/game-assets/catalog.json || {
            echo "Restore the approved local/assets backup before enabling PEAK_PAGES_ENABLED."
            exit 1
          }
      - name: Validate viewer and data
        run: |
          npm --prefix PeakTrailPlatform/web run check
          npm --prefix PeakTrailPlatform/web test
          node --test PeakTrailPlatform/tools/tests/*.test.mjs
          node PeakTrailPlatform/tools/validate-data.mjs
      - name: Stage static site
        run: node PeakTrailPlatform/tools/stage-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: PeakTrailPlatform/site-dist
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

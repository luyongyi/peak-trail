# Install only after the dedicated certificate exists. Other virtual hosts stay unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name peak.mylus.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/peak-trail-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://peak.mylus.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name peak.mylus.cn;
    ssl_certificate /etc/letsencrypt/live/peak.mylus.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peak.mylus.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/peak-trail/state/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache";

    location ~ /\. { deny all; }
    # Fingerprinted geometry is immutable; manifests and code must revalidate.
    location ~ "^/data/maps/packs/sha256-[a-f0-9]{64}/.+\.(glb|gz|f32|png)$" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /watch/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}

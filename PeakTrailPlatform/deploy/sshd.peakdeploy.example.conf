# Administrator-reviewed example for /etc/ssh/sshd_config.d/90-peak-trail.conf.
# Test with sshd -t and keep the existing administrator session open before reload.
# Verify the resulting per-user policy with sshd -T -C user=peakdeploy,host=localhost,addr=127.0.0.1.
# Existing global AcceptEnv / PermitUserEnvironment policy must not allow NODE_OPTIONS,
# LD_PRELOAD, PATH, BASH_ENV, ENV or other client-controlled execution settings.
Match User peakdeploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/peakdeploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/bin/node /srv/peak-trail/receiver.mjs
    PermitTTY no
    PermitUserRC no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
Match all

# Administrator-reviewed example ONLY. Does not replace an existing virtual host.
# Integrate with your existing HTTPS reverse proxy after testing on loopback.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /srv/peak-trail/state/current;
    index index.html;
    autoindex off;

    # The surrounding nginx http block should include the standard mime.types.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache";

    # No uploads, execution, directory listing, private dotfiles, or live relay proxy.
    location ~ /\. { deny all; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
